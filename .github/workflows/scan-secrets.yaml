name: Scan secrets

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scan-secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: blackstorm-prod
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: gitleaks uv
          cache: false
      - name: Validate template secret policy
        run: uv run --script scripts/check-template-secrets.py --all
      - name: Scan Git history for exposed credentials
        run: gitleaks git --log-opts=--all --redact=100 --no-banner
