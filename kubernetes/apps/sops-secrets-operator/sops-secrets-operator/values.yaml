# El operador descifra los SopsSecret que ArgoCD aplica al cluster y los convierte en Secrets.
# Usa la misma clave que el repo (age.key), que el bootstrap carga como Secret "sops-age".

secretsAsFiles:
  - name: sops-age
    mountPath: /etc/sops-age
    secretName: sops-age

extraEnv:
  - name: SOPS_AGE_KEY_FILE
    value: /etc/sops-age/age.key
