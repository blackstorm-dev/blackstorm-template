apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd

# ArgoCD gestionándose a sí mismo: mismo chart y values que instaló el bootstrap.
helmCharts:
  - name: argo-cd
    repo: https://argoproj.github.io/argo-helm
    version: 10.9.2
    releaseName: argocd
    namespace: argocd
    valuesFile: values.yaml
    includeCRDs: true
