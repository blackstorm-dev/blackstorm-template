# Argo aplica los CRDs; no hace falta el Job de upgrade de Helm.
upgradeCRDs: false
cleanUpCRDs: false
credentials:
  existingSecret: velero-spaces
initContainers:
  - name: aws-plugin
    image: velero/velero-plugin-for-aws:v1.14.3
    volumeMounts:
      - name: plugins
        mountPath: /target
snapshotsEnabled: false
deployNodeAgent: true
configuration:
  uploaderType: kopia
  defaultVolumesToFsBackup: false
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi
nodeAgent:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 1Gi
metrics:
  serviceMonitor:
    enabled: true
    autodetect: false
    additionalLabels:
      release: monitoring
  nodeAgentPodMonitor:
    enabled: true
    autodetect: false
    additionalLabels:
      release: monitoring
