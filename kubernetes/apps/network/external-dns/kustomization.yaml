apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: network

# external-dns: por cada HTTPRoute enganchado a una puerta con label external-dns=enabled, crea (y borra)
# el registro DNS en Cloudflare. Apunta al destino que diga la anotación target de esa puerta (el túnel).
helmCharts:
  - name: external-dns
    repo: https://kubernetes-sigs.github.io/external-dns/
    version: 1.22.0
    releaseName: external-dns
    namespace: network
    valuesFile: values.yaml
