# Cómo se crean los pods de envoy-external. El controlador (envoy-gateway) lee esto por el parametersRef del Gateway.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-external
  namespace: network
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: ClusterIP # cada entorno decide si lo expone de otra forma (local: NodePort)
        name: envoy-external # nombre fijo: en prod es el origen del túnel (envoy-external.network.svc.cluster.local)
      envoyDeployment:
        container:
          resources:
            requests: # el default es 512Mi; un Envoy usa ~50Mi. Con el default, dos puertas se comen el nodo chico.
              cpu: 50m
              memory: 64Mi
