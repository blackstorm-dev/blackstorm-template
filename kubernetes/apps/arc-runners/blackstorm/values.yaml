githubConfigUrl: https://github.com/configured-by-environment
# Lo carga make bootstrap-arc desde live/<env>/secrets/github-arc.yaml cifrado con SOPS.
githubConfigSecret: github-arc

minRunners: 0
maxRunners: 1

containerMode:
  type: dind

# Evita el lookup de Helm contra el cluster al renderizar con ArgoCD/Kustomize.
controllerServiceAccount:
  namespace: arc-systems
  name: arc-controller

listenerTemplate:
  spec:
    containers:
      - name: listener
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi

template:
  spec:
    automountServiceAccountToken: false
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:2.337.0
        command: ["/home/runner/run.sh"]
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
