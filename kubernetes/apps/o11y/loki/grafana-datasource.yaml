apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-grafana-datasource
  labels:
    grafana_datasource: "1"
data:
  loki.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.o11y.svc.cluster.local:3100
        isDefault: false
        editable: false
        jsonData:
          derivedFields:
            - name: TraceID
              matcherRegex: '"trace_id"\s*:\s*"([a-f0-9]{32})"'
              datasourceUid: tempo
              url: '$${__value.raw}'
              urlDisplayLabel: View trace
