apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../../kubernetes/apps/kube-system/metrics-server
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: metrics-server
    # El certificado del kubelet de kind no está firmado por la CA del clúster.
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --kubelet-insecure-tls
