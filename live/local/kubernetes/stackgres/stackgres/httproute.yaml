apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stackgres
  namespace: stackgres
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-external
      namespace: network
      sectionName: https
  hostnames: [configured-by-environment]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: stackgres-restapi
          port: 80
          weight: 1
