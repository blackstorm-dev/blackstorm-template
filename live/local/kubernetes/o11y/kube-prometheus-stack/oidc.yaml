apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring-grafana
  namespace: o11y
  annotations:
    reloader.stakater.com/auto: 'true'
spec:
  template:
    spec:
      containers:
        - name: grafana
          env:
            - name: GF_SERVER_ROOT_URL
              value: configured-by-environment
            - name: GF_AUTH_GENERIC_OAUTH_ENABLED
              value: 'true'
            - name: GF_AUTH_GENERIC_OAUTH_NAME
              value: GitHub
            - name: GF_AUTH_GENERIC_OAUTH_ICON
              value: github
            - name: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
              value: grafana
            - name: GF_AUTH_GENERIC_OAUTH_SCOPES
              value: openid profile email groups offline_access
            - name: GF_AUTH_GENERIC_OAUTH_AUTH_URL
              value: configured-by-environment
            - name: GF_AUTH_GENERIC_OAUTH_TOKEN_URL
              value: http://dex.identity.svc.cluster.local:5556/token
            - name: GF_AUTH_GENERIC_OAUTH_API_URL
              value: http://dex.identity.svc.cluster.local:5556/userinfo
            - name: GF_AUTH_GENERIC_OAUTH_JWK_SET_URL
              value: http://dex.identity.svc.cluster.local:5556/keys
            - name: GF_AUTH_GENERIC_OAUTH_VALIDATE_ID_TOKEN
              value: 'true'
            - name: GF_AUTH_GENERIC_OAUTH_USE_PKCE
              value: 'true'
            - name: GF_AUTH_GENERIC_OAUTH_USE_REFRESH_TOKEN
              value: 'true'
            - name: GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH
              value: preferred_username
            - name: GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH
              value: preferred_username == 'configured-by-environment' && 'GrafanaAdmin' || 'None'
            - name: GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT
              value: 'true'
            - name: GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN
              value: 'true'
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: 'true'
            - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: grafana-oidc
                  key: client-secret
