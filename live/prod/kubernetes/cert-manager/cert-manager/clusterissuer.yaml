# Let's Encrypt validando por DNS-01: cert-manager crea un TXT en Cloudflare con el token cloudflare-api-token
# (lo carga el bootstrap). Así puede emitir wildcards sin exponer nada.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
