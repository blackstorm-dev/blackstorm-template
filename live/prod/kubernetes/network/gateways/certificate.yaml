# Certificado de las puertas en prod: Let's Encrypt, wildcard, validado por DNS en Cloudflare. Se renueva solo.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-tls
  namespace: network
spec:
  secretName: wildcard-tls
  dnsNames:
    - "configured-by-environment"
    - configured-by-environment
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
