apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../../kubernetes/apps/arc-runners/blackstorm

patches:
  - target:
      group: actions.github.com
      version: v1alpha1
      kind: AutoscalingRunnerSet
      name: blackstorm
    patch: |-
      - op: add
        path: /spec/runnerScaleSetName
        value: configured-by-environment

transformers:
  - ../../../transformers
