[tools]
uv = "0.11.16"
age = "1.3.2"
argocd = "3.5.3"
argo-rollouts = "1.10.0"
"asdf:mise-plugins/mise-helm-diff" = "3.15.15"
doctl = "1.174.0"
gh = "2.92.0"
gitleaks = "8.30.1"
helm = "4.3.0"
helmfile = "1.8.0"
k9s = "0.51.0"
kubeconform = "0.8.0"
kubectl = "1.37.1"
lefthook = "2.1.14"
sops = "3.13.3"
terraform = "1.16.4"
terragrunt = "1.1.6"

[env]
# Dentro del repo, kubectl ve solo los clusters de este repo: local (actual) y prod.
KUBECONFIG = "{{config_root}}/.kube/local:{{config_root}}/.kube/prod"
# La clave con la que sops cifra y descifra todo lo de secrets/. La genera make init.
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
